name: Backend Tests

on:
  push:
    branches: [main, develop]
    paths: ["backend/**", "source/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", "source/**", ".github/workflows/backend-tests.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt pytest build
      - name: Build browser wheel
        run: |
          python -m build --wheel source --outdir "$RUNNER_TEMP/backend-wheel"
          mkdir -p backend/app/static/wheel
          cp "$RUNNER_TEMP"/backend-wheel/miniworlds-*.whl backend/app/static/wheel/miniworlds.whl
      - name: API, privacy and backup recovery tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q backend/tests
      - name: Install browser
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/backend-browser" playwright
          "$RUNNER_TEMP/backend-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Classroom browser workflow
        env:
          NODE_PATH: ${{ runner.temp }}/backend-browser/node_modules
        run: |
          python backend/tests/serve_smoke.py &
          smoke_pid=$!
          trap 'kill "$smoke_pid" 2>/dev/null || true; wait "$smoke_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8896/healthz
          node backend/tests/browser-workflow.cjs
