name: miniworlds-backend

x-runtime: &runtime
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE muss auf ein getestetes Release zeigen}
  runtime: ${BACKEND_RUNTIME:-runc}
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 1g
  cpus: 1.5
  tmpfs:
    - /tmp:size=256m,mode=1777
  env_file: [backend.env]
  environment:
    DATABASE_URL: sqlite:////data/app.db
    MEDIA_ROOT: /data/media
    MINIWORLDS_GIT_ROOT: /data/git
    COOKIE_SECURE: "1"
    BASE_URL: https://backend.editor.opencoding.de

services:
  backend:
    <<: *runtime
    container_name: miniworlds-backend
    restart: unless-stopped
    volumes: [data:/data]
    networks: [traefik_default]
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_default
      traefik.http.routers.miniworlds-backend.rule: Host(`backend.editor.opencoding.de`)
      traefik.http.routers.miniworlds-backend.entrypoints: websecure
      traefik.http.routers.miniworlds-backend.tls.certresolver: alpnresolver
      traefik.http.routers.miniworlds-backend.service: miniworlds-backend
      traefik.http.services.miniworlds-backend.loadbalancer.server.port: "8000"
  backup:
    <<: *runtime
    profiles: [maintenance]
    network_mode: none
    command: [python, -m, app.backups, create, --directory, /backups, --keep, "7"]
    volumes: [data:/data, backups:/backups]

volumes:
  data:
    name: miniworlds-backend-data
  backups:
    name: miniworlds-backend-backups

networks:
  traefik_default:
    external: true
