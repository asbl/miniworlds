{% extends "base.html" %}
{% block title %}Lehrercode einlösen{% endblock %}
{% block content %}
<section class="auth-panel">
<h2>Lehrercode einlösen</h2>
<form id="claim-form">
  <label>Lehrercode <input name="invite_code" required autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
  <label>Schule <input name="school" disabled id="school-field"></label>
  <label>E-Mail <input type="email" name="email" required autocomplete="username"></label>
  <label>Passwort (min. 8 Zeichen) <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
  <button type="submit">Zugang anlegen</button>
  <p class="error" id="err" role="alert"></p>
</form>
<p><a href="/teacher/login">Zur Anmeldung</a></p>
</section>
{% endblock %}
