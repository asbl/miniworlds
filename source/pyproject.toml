[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miniworlds"
version = "4.4.0.1"
description = "Create 2D worlds and games"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["games", "education", "mini-worlds", "pygame"]
authors = [
    { name = "Andreas Siebel", email = "andreas.siebel@it-teaching.de" },
]
dependencies = [
    "pygame-ce",
    "numpy",
]
classifiers = [
    "Programming Language :: Python",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/asbl/miniworlds"
Download = "https://github.com/asbl/miniworlds"

[tool.setuptools.packages.find]
where = ["."]
include = ["miniworlds*"]
exclude = ["contrib", "docs", "tests", "examples"]

[tool.setuptools.package-data]
miniworlds = ["py.typed", "resources/*.png"]
